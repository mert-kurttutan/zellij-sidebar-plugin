name: Cut Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: wasm32-wasip1
  WASM_ARTIFACT: vertical-sidebar.wasm

jobs:
  release:
    name: Tag Cargo version and upload WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Cargo version
        id: cargo
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vertical-sidebar") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if needed
        env:
          TAG: ${{ steps.cargo.outputs.tag }}
          VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; using it for the release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WASM_TARGET }}

      - name: Build release WASM
        run: cargo build --release --locked

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp "target/${WASM_TARGET}/release/${WASM_ARTIFACT}" "dist/${WASM_ARTIFACT}"
          cd dist
          sha256sum "${WASM_ARTIFACT}" > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cargo.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/vertical-sidebar.wasm
            dist/SHA256SUMS
