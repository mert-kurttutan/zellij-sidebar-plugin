name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: wasm32-wasip1
  WASM_ARTIFACT: vertical-sidebar.wasm

jobs:
  release:
    name: Build and upload WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WASM_TARGET }}

      - name: Build release WASM
        run: cargo build --release --locked

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp "target/${WASM_TARGET}/release/${WASM_ARTIFACT}" "dist/${WASM_ARTIFACT}"
          cd dist
          sha256sum "${WASM_ARTIFACT}" > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/vertical-sidebar.wasm
            dist/SHA256SUMS
